<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Brélie — Coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --brelie-blue: #3D5A99;
    --bg: #F7F5F1;
    --muted: #6B7A99;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    font-family: 'Jost', sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .logo-corner {
    position: absolute;
    top: 28px;
    left: 28px;
  }

  .logo-corner img {
    width: 56px;
    height: auto;
    display: block;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  .brand {
    font-family: 'Cormorant Garamond', serif;
    color: var(--brelie-blue);
    font-size: clamp(3rem, 9vw, 5.5rem);
    font-weight: 500;
    letter-spacing: 0.01em;
    margin: 0;
    line-height: 1.1;
  }

  .tagline {
    margin: 14px 0 0;
    font-size: clamp(0.95rem, 2vw, 1.15rem);
    font-weight: 300;
    letter-spacing: 0.12em;
    color: var(--muted);
  }

  .under-construction {
    margin: 6px 0 0;
    font-size: clamp(0.7rem, 1.4vw, 0.8rem);
    font-weight: 300;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0.7;
  }

  .gate {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }

  .gate-row {
    display: flex;
    gap: 8px;
  }

  .gate input[type="password"] {
    font-family: 'Jost', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    padding: 10px 14px;
    border: 1px solid rgba(61, 90, 153, 0.25);
    border-radius: 4px;
    background: #FFFFFF;
    color: var(--brelie-blue);
    width: 180px;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .gate input[type="password"]:focus {
    border-color: var(--brelie-blue);
  }

  .gate button {
    font-family: 'Jost', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 18px;
    border: 1px solid var(--brelie-blue);
    border-radius: 4px;
    background: var(--brelie-blue);
    color: #FFFFFF;
    cursor: pointer;
    transition: opacity 0.2s ease;
  }

  .gate button:hover {
    opacity: 0.85;
  }

  .gate-message {
    font-size: 0.78rem;
    letter-spacing: 0.03em;
    min-height: 16px;
    color: var(--muted);
  }

  .gate-message.error {
    color: #A6453B;
  }

  .gate-message.success {
    color: var(--brelie-blue);
  }

  footer {
    text-align: center;
    padding: 20px;
    font-size: 0.75rem;
    color: var(--muted);
    font-weight: 300;
  }

  @media (max-width: 480px) {
    .logo-corner {
      top: 18px;
      left: 18px;
    }
    .logo-corner img {
      width: 42px;
    }
  }
</style>
</head>
<body>

  <div class="logo-corner">
    <img src="dlb-seal.png" alt="La Brélie seal">
  </div>

  <main>
    <div>
      <p class="brand">La Brélie</p>
      <p class="tagline">Coming soon</p>
      <p class="under-construction">Under construction</p>

      <div class="gate">
        <form class="gate-row" id="gate-form" autocomplete="off">
          <input type="password" id="gate-passcode" placeholder="Passcode" aria-label="Passcode">
          <button type="submit">Enter</button>
        </form>
        <p class="gate-message" id="gate-message"></p>
      </div>
    </div>
  </main>

  <footer>© 2026 La Brélie</footer>

  <script>
    // Simple client-side passcode gate — not real security, just keeps
    // casual visitors from seeing the work-in-progress funnel.
    // Change the passcode by editing the value below.
    const PASSCODE = "@r1huRSB2026";
    const STORAGE_KEY = "labrelie_gate_ok";

    const form = document.getElementById("gate-form");
    const input = document.getElementById("gate-passcode");
    const message = document.getElementById("gate-message");

    function showGranted() {
      message.textContent = "Access granted — preview coming soon.";
      message.className = "gate-message success";
      form.style.display = "none";
    }

    if (localStorage.getItem(STORAGE_KEY) === "true") {
      showGranted();
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (input.value === PASSCODE) {
        localStorage.setItem(STORAGE_KEY, "true");
        showGranted();
      } else {
        message.textContent = "Incorrect passcode.";
        message.className = "gate-message error";
        input.value = "";
        input.focus();
      }
    });
  </script>

</body>
</html>
